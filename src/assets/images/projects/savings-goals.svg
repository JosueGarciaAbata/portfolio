<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Savings and financial goals simulator">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg4)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="80" y="118" fill="#e2e8f0" font-size="56" font-weight="800" letter-spacing="-1">Savings &amp; Goals Simulator</text>
    <text x="82" y="162" fill="#7dd3fc" font-size="24" font-weight="600" letter-spacing="2">A RAPID FULL-STACK SPRINT</text>

    <!-- goal card -->
    <rect x="80" y="230" width="640" height="360" rx="18" fill="#0f1b30" stroke="#1e2d4a"/>
    <text x="112" y="290" fill="#e2e8f0" font-size="26" font-weight="700">Emergency Fund</text>
    <text x="112" y="322" fill="#64748b" font-size="17">Target $5,000 &#183; deadline Dec</text>

    <!-- progress bar -->
    <rect x="112" y="360" width="576" height="26" rx="13" fill="#16243d"/>
    <rect x="112" y="360" width="404" height="26" rx="13" fill="url(#prog)"/>
    <text x="112" y="424" fill="#4ade80" font-size="22" font-weight="800">70%</text>
    <text x="170" y="424" fill="#94a3b8" font-size="18">$3,500 saved</text>

    <!-- contributions -->
    <rect x="112" y="452" width="576" height="44" rx="10" fill="#13203a"/>
    <text x="132" y="480" fill="#cbd5e1" font-size="16">Contribution &#183; +$250</text>
    <text x="600" y="480" fill="#64748b" font-size="15">this week</text>
    <rect x="112" y="510" width="576" height="44" rx="10" fill="#13203a"/>
    <text x="132" y="538" fill="#cbd5e1" font-size="16">Suggestion &#183; save $180 / week</text>

    <!-- side: target ring -->
    <g transform="translate(900,400)">
      <circle r="150" fill="none" stroke="#16243d" stroke-width="26"/>
      <circle r="150" fill="none" stroke="url(#prog)" stroke-width="26" stroke-linecap="round"
        stroke-dasharray="660 942" transform="rotate(-90)"/>
      <text x="0" y="-6" fill="#e2e8f0" font-size="46" font-weight="800" text-anchor="middle">70%</text>
      <text x="0" y="30" fill="#94a3b8" font-size="18" text-anchor="middle">on track</text>
    </g>

    <g font-family="ui-monospace, monospace" font-size="18" font-weight="700">
      <text x="84" y="626" fill="#a78bfa">Laravel 12</text>
      <text x="232" y="626" fill="#38bdf8">React</text>
      <text x="330" y="626" fill="#60a5fa">JWT</text>
      <text x="404" y="626" fill="#4ade80">PDF Reports</text>
    </g>
  </g>
</svg>
