<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agile asset maintenance project board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="80" y="120" fill="#e2e8f0" font-size="58" font-weight="800" letter-spacing="-1">Agile Asset Maintenance</text>
    <text x="80" y="168" fill="#7dd3fc" font-size="26" font-weight="600" letter-spacing="2">SCRUM &#183; KANBAN &#183; SCRUMBAN</text>

    <!-- columns -->
    <g>
      <!-- To Do -->
      <rect x="80" y="230" width="320" height="360" rx="16" fill="#0f1b30" stroke="#1e2d4a"/>
      <text x="104" y="272" fill="#94a3b8" font-size="20" font-weight="700" letter-spacing="1">TO DO</text>
      <rect x="104" y="292" width="272" height="56" rx="10" fill="#16243d"/>
      <rect x="120" y="312" width="150" height="10" rx="5" fill="#33507e"/>
      <rect x="104" y="364" width="272" height="56" rx="10" fill="#16243d"/>
      <rect x="120" y="384" width="190" height="10" rx="5" fill="#33507e"/>
      <rect x="104" y="436" width="272" height="56" rx="10" fill="#16243d"/>
      <rect x="120" y="456" width="120" height="10" rx="5" fill="#33507e"/>

      <!-- Doing -->
      <rect x="440" y="230" width="320" height="360" rx="16" fill="#0f1b30" stroke="#1e2d4a"/>
      <text x="464" y="272" fill="#fcd34d" font-size="20" font-weight="700" letter-spacing="1">DOING</text>
      <rect x="464" y="292" width="272" height="56" rx="10" fill="#1b2942" stroke="#3b82f6"/>
      <rect x="480" y="312" width="170" height="10" rx="5" fill="url(#accent)"/>
      <rect x="464" y="364" width="272" height="56" rx="10" fill="#1b2942" stroke="#f59e0b"/>
      <rect x="480" y="384" width="130" height="10" rx="5" fill="#f59e0b"/>

      <!-- Done -->
      <rect x="800" y="230" width="320" height="360" rx="16" fill="#0f1b30" stroke="#1e2d4a"/>
      <text x="824" y="272" fill="#4ade80" font-size="20" font-weight="700" letter-spacing="1">DONE</text>
      <rect x="824" y="292" width="272" height="56" rx="10" fill="#13241c"/>
      <rect x="840" y="312" width="200" height="10" rx="5" fill="#22c55e"/>
      <rect x="824" y="364" width="272" height="56" rx="10" fill="#13241c"/>
      <rect x="840" y="384" width="160" height="10" rx="5" fill="#22c55e"/>
      <rect x="824" y="436" width="272" height="56" rx="10" fill="#13241c"/>
      <rect x="840" y="456" width="180" height="10" rx="5" fill="#22c55e"/>
      <rect x="824" y="508" width="272" height="56" rx="10" fill="#13241c"/>
      <rect x="840" y="528" width="140" height="10" rx="5" fill="#22c55e"/>
    </g>
  </g>
</svg>
